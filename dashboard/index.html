<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0E1F33">
<title>Fortivex CRM — Private</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F8FA; --surface:#fff; --ink:#0E1F33; --text:#13212F; --muted:#46586A;
  --subtle:#6B7C8C; --rule:#DCE3EA; --accent:#0A6B5F; --accent-tint:#E9F4F2;
  --ready:#0A6B5F; --enrich:#9A6700; --lost:#B42318; --chip:#EEF3F7;
  --sans:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',monospace;
  --max:1200px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans)}
a{color:var(--accent)}
.wrap{max-width:var(--max);margin:0 auto;padding:24px clamp(16px,4vw,32px) 64px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.brand{font-weight:700;letter-spacing:-.02em;color:var(--ink);font-size:1.25rem}
.brand span{color:var(--accent)}
.meta{color:var(--subtle);font-size:.85rem;font-family:var(--mono)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px}
.card .label{font-size:.75rem;color:var(--subtle);text-transform:uppercase;letter-spacing:.04em}
.card .val{font-size:1.75rem;font-weight:700;letter-spacing:-.03em;margin-top:4px;color:var(--ink)}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
input[type=search],select{border:1px solid var(--rule);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;min-width:0}
input[type=search]{flex:1;min-width:200px}
.table-wrap{background:var(--surface);border:1px solid var(--rule);border-radius:14px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--rule);vertical-align:top}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--subtle);background:#fafbfc;position:sticky;top:0;cursor:pointer;user-select:none;white-space:nowrap}
tr:hover td{background:#f7fbfa}
tr.dnc td{opacity:.55}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--chip)}
.badge.ready{background:var(--accent-tint);color:var(--ready)}
.badge.enrich{background:#FFF4D6;color:var(--enrich)}
.badge.lost{background:#FBEDEB;color:var(--lost)}
.company{font-weight:600;color:var(--ink)}
.sub{color:var(--subtle);font-size:.8rem;margin-top:2px}
.details{display:none;background:#f9fbfc}
.details.open{display:table-row}
.details td{padding:12px 16px 18px;font-size:.88rem;color:var(--muted)}
.details dl{display:grid;grid-template-columns:140px 1fr;gap:6px 12px;margin:0}
.details dt{color:var(--subtle);font-family:var(--mono);font-size:.75rem}
.details dd{margin:0}
.empty{padding:40px;text-align:center;color:var(--subtle)}
.error{padding:24px;border:1px solid #FBEDEB;background:#FBEDEB;border-radius:12px;color:var(--lost)}
footer{margin-top:18px;color:var(--subtle);font-size:.8rem}
button.rowbtn{all:unset;cursor:pointer;color:var(--accent);font-size:.8rem;font-weight:600}
@media (max-width:720px){th.hide-sm,td.hide-sm{display:none} .details dl{grid-template-columns:1fr}}
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div>
        <div class="brand">Fortivex <span>CRM</span></div>
        <div class="meta" id="sourceMeta">Private · Florida PM leads</div>
      </div>
      <div class="meta" id="updatedMeta"></div>
    </header>
    <div class="cards" id="cards"></div>
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search company, owner, email, city…" autocomplete="off">
      <select id="stage">
        <option value="">All stages</option>
        <option value="Ready">Ready</option>
        <option value="Needs Enrichment">Needs Enrichment</option>
        <option value="Lost">Lost</option>
      </select>
      <select id="enrich">
        <option value="">All enrich</option>
        <option value="has_email">Has email</option>
        <option value="missing_email">Missing email</option>
      </select>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th data-key="company">Company</th>
            <th data-key="city" class="hide-sm">City</th>
            <th data-key="stage">Stage</th>
            <th data-key="ownerName" class="hide-sm">Owner</th>
            <th data-key="ownerEmail">Email</th>
            <th data-key="reviews" class="hide-sm">Reviews</th>
            <th data-key="nextAction" class="hide-sm">Next</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="tbody"><tr><td colspan="8" class="empty">Loading…</td></tr></tbody>
      </table>
    </div>
    <footer id="countFooter"></footer>
  </div>
<script>
const state = { leads: [], sortKey: 'company', sortDir: 1, openId: null };
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function badgeClass(stage) {
  if (stage === 'Ready') return 'ready';
  if (stage === 'Lost') return 'lost';
  return 'enrich';
}

function renderCards(summary) {
  const items = [
    ['Total', summary.total ?? 0],
    ['Ready', summary.byStage?.Ready || 0],
    ['Needs Enrichment', summary.byStage?.['Needs Enrichment'] || 0],
    ['Lost', summary.byStage?.Lost || 0],
    ['With email', summary.withEmail || 0],
  ];
  $('cards').innerHTML = items.map(([label, val]) =>
    `<div class="card"><div class="label">${label}</div><div class="val">${val}</div></div>`
  ).join('');
}

function filtered() {
  const q = $('q').value.trim().toLowerCase();
  const stage = $('stage').value;
  const enrich = $('enrich').value;
  let rows = state.leads.filter(l => {
    if (stage && l.stage !== stage) return false;
    if (enrich && l.enrichStatus !== enrich) return false;
    if (!q) return true;
    const hay = [l.company, l.city, l.ownerName, l.ownerEmail, l.category, l.notes, l.nextAction]
      .join(' ').toLowerCase();
    return hay.includes(q);
  });
  const k = state.sortKey;
  rows.sort((a, b) => {
    let av = a[k], bv = b[k];
    if (k === 'reviews' || k === 'rating') {
      av = Number(av) || 0; bv = Number(bv) || 0;
      return (av - bv) * state.sortDir;
    }
    av = (av ?? '').toString().toLowerCase();
    bv = (bv ?? '').toString().toLowerCase();
    if (av < bv) return -1 * state.sortDir;
    if (av > bv) return 1 * state.sortDir;
    return 0;
  });
  return rows;
}

function renderTable() {
  const rows = filtered();
  $('countFooter').textContent = `${rows.length} lead${rows.length === 1 ? '' : 's'} shown · ${state.leads.length} total`;
  if (!rows.length) {
    $('tbody').innerHTML = `<tr><td colspan="8" class="empty">No leads match these filters.</td></tr>`;
    return;
  }
  $('tbody').innerHTML = rows.map(l => {
    const open = state.openId === l.id;
    return `
      <tr class="${l.doNotContact ? 'dnc' : ''}">
        <td><div class="company">${esc(l.company)}</div><div class="sub">${esc(l.category)}</div></td>
        <td class="hide-sm">${esc(l.city)}</td>
        <td><span class="badge ${badgeClass(l.stage)}">${esc(l.stage)}</span></td>
        <td class="hide-sm">${esc(l.ownerName) || '—'}</td>
        <td>${l.ownerEmail ? `<a href="mailto:${esc(l.ownerEmail)}">${esc(l.ownerEmail)}</a>` : '—'}</td>
        <td class="hide-sm">${esc(l.reviews)}${l.rating ? ` · ${esc(l.rating)}★` : ''}</td>
        <td class="hide-sm">${esc(l.nextAction) || '—'}</td>
        <td><button type="button" class="rowbtn" data-toggle="${esc(l.id)}">${open ? 'Hide' : 'Details'}</button></td>
      </tr>
      <tr class="details ${open ? 'open' : ''}">
        <td colspan="8">
          <dl>
            <dt>Phone</dt><dd>${esc(l.phone) || '—'}</dd>
            <dt>Website</dt><dd>${l.website ? `<a href="${esc(l.website)}" target="_blank" rel="noopener">${esc(l.website)}</a>` : '—'}</dd>
            <dt>LinkedIn</dt><dd>${l.ownerLinkedin ? `<a href="${esc(l.ownerLinkedin)}" target="_blank" rel="noopener">Profile</a>` : '—'}</dd>
            <dt>Email source</dt><dd>${esc(l.emailSource) || '—'}</dd>
            <dt>Sequence</dt><dd>${esc(l.sequenceVersion) || '—'}</dd>
            <dt>Last contact</dt><dd>${esc(l.lastContact) || '—'}</dd>
            <dt>Do not contact</dt><dd>${l.doNotContact ? 'Yes' : 'No'}</dd>
            <dt>Notes</dt><dd>${esc(l.notes) || '—'}</dd>
          </dl>
        </td>
      </tr>`;
  }).join('');
}

function bind() {
  $('q').addEventListener('input', renderTable);
  $('stage').addEventListener('change', renderTable);
  $('enrich').addEventListener('change', renderTable);
  document.querySelectorAll('th[data-key]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      if (state.sortKey === key) state.sortDir *= -1;
      else { state.sortKey = key; state.sortDir = 1; }
      renderTable();
    });
  });
  $('tbody').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-toggle]');
    if (!btn) return;
    const id = btn.getAttribute('data-toggle');
    state.openId = state.openId === id ? null : id;
    renderTable();
  });
}

async function boot() {
  try {
    const res = await fetch('./data/crm.json', { cache: 'no-store' });
    if (!res.ok) throw new Error('Failed to load CRM data (' + res.status + ')');
    const data = await res.json();
    state.leads = data.leads || [];
    renderCards(data.summary || {});
    $('sourceMeta').textContent = 'Private · ' + (data.summary?.sourceSheet || 'CRM');
    const updated = data.summary?.updatedAt;
    $('updatedMeta').textContent = updated ? ('Updated ' + new Date(updated).toLocaleString()) : '';
    bind();
    renderTable();
  } catch (err) {
    $('tbody').innerHTML = `<tr><td colspan="8"><div class="error">${esc(err.message)}</div></td></tr>`;
  }
}

boot();
</script>
</body>
</html>
